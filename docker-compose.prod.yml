services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nocticketing
    volumes:
      - noc_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nocticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  shift-solver:
    build: ./services/shift-solver
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/nocticketing?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-my_super_secret_key_123}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Jakarta
      - SHIFT_SOLVER_URL=http://shift-solver:8000
      - SCHEDULE_CRON_SECRET=${SCHEDULE_CRON_SECRET:-noc-schedule-cron}
      - APP_INTERNAL_URL=http://127.0.0.1:3000
    command: sh -c "sleep 5 && npx prisma db push --accept-data-loss && (node scripts/normalize_ticket_statuses.js || true) && npm run build && (node scripts/schedule_cron.js & npm start)"
    depends_on:
      db:
        condition: service_healthy
      shift-solver:
        condition: service_healthy
    volumes:
      - noc_uploads:/app/public/uploads

volumes:
  noc_db_data:
  noc_uploads:
